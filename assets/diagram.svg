<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="720" height="160" fill="#ffffff"/>
  <!-- mac box -->
  <rect x="8" y="8" width="220" height="144" fill="none" stroke="#000" stroke-width="2"/>
  <text x="28" y="60" font-size="13" font-weight="700" fill="#000">YOUR MACBOOK</text>
  <text x="28" y="86" font-size="13" fill="#4d4d4d">keyboard</text>
  <text x="28" y="106" font-size="13" fill="#4d4d4d">trackpad</text>
  <!-- middle -->
  <rect x="250" y="8" width="220" height="144" fill="#000"/>
  <text x="360" y="72" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">⌘ ⌥ T</text>
  <text x="360" y="96" font-size="11" fill="#999" text-anchor="middle">press to send</text>
  <!-- android box -->
  <rect x="492" y="8" width="220" height="144" fill="none" stroke="#000" stroke-width="2"/>
  <text x="512" y="60" font-size="13" font-weight="700" fill="#000">YOUR ANDROID</text>
  <text x="512" y="86" font-size="13" fill="#4d4d4d">types here</text>
  <text x="512" y="106" font-size="13" fill="#4d4d4d">clicks here</text>
</svg>
